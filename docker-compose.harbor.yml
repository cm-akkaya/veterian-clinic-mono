# Bu dosya Jenkins pipeline tarafından kullanılır.
# Image'ı local build yerine Harbor'dan çeker.
# Kullanım: export IMAGE_TAG=42
#           export HARBOR_FQDN=172.17.160.76
#           export HARBOR_PROJECT=ngn-list-vmware
#           docker compose -f docker-compose.harbor.yml up -d
# YADA TEK KOMUT: 
# dev için bu yeterli:
# IMAGE_TAG=dev-11 HARBOR_FQDN=172.17.160.76 HARBOR_PROJECT=ngn-list-vmware docker compose -f docker-compose.harbor.yml up -d
# prod çalıştırmak için docker-compose.harbor.yml içindeki image satırını değiştir:  image: ${HARBOR_FQDN}/${HARBOR_PROJECT}/spring-ngn-app-prodk8s:${IMAGE_TAG}
# IMAGE_TAG=prod-8 HARBOR_FQDN=172.17.160.76 HARBOR_PROJECT=ngn-list-vmware/spring-ngn-app-prodk8s docker compose -f docker-compose.harbor.yml up -d
# Pull komutları:  docker pull 172.17.160.76/ngn-list-vmware/spring-ngn-app:dev-11
#               docker pull 172.17.160.76/ngn-list-vmware/spring-ngn-app-prodk8s:prod-8
services:
  app:
    image: ${HARBOR_FQDN}/${HARBOR_PROJECT}/spring-ngn-app:${IMAGE_TAG}
    container_name: app
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "8081:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=postgres
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/petclinic
      - SPRING_DATASOURCE_USERNAME=petclinic
      - SPRING_DATASOURCE_PASSWORD=petclinic
    volumes:
      - app_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  postgres:
    image: postgres:18.1
    container_name: postgres
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=petclinic
      - POSTGRES_USER=petclinic
      - POSTGRES_DB=petclinic
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petclinic -d petclinic"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
  app_logs:
