apiVersion: apps/v1
kind: Deployment
metadata:
  name: petclinic-adminer
  namespace: ngn-springboot
  labels:
    app: petclinic-adminer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: petclinic-adminer
  template:
    metadata:
      labels:
        app: petclinic-adminer
    spec:
      containers:
        - name: adminer
          image: adminer:4.8.1
          ports:
            - containerPort: 8080
              name: http
          env:
            # Login formunda "Server" alanini otomatik dolduran ayar.
            # "mysql" burada k8s Service adi - pod DNS uzerinden cozuyor.
            - name: ADMINER_DEFAULT_SERVER
              value: "mysql"
            - name: ADMINER_DESIGN
              value: "pepa-linha"
          # NOT: Adminer login formunda "System" (surucu) alanini elle "MySQL"
          # olarak secmen gerekir - bunu otomatik atayan resmi bir env var yok.
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: petclinic-adminer
  namespace: ngn-springboot
spec:
  selector:
    app: petclinic-adminer
  type: NodePort
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30082   # apply etmeden once bu portun bos oldugunu dogrula
      name: http
