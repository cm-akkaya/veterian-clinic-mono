# -----------------------------------------------------------------------
# 1) DockerHub pull secret - BOS (public repo oldugu icin gercek kimlik
#    bilgisi yok). Ileride private repo'ya gecerseniz asagidaki komutla
#    dolu bir secret ile bunu degistirin (ayni isimle):
#
#    kubectl create secret docker-registry dockerhub-pull-secret \
#      --docker-server=https://index.docker.io/v1/ \
#      --docker-username='<DOCKERHUB_USER>' \
#      --docker-password='<DOCKERHUB_TOKEN>' \
#      -n ngn-springboot --dry-run=client -o yaml | kubectl apply -f -
# -----------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: dockerhub-pull-secret
  namespace: ngn-springboot
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: eyJhdXRocyI6e319   # base64("{"auths":{}}") - bos, kimlik bilgisi yok
---
# -----------------------------------------------------------------------
# 2) MySQL credential secret
#    Anahtar isimleri, MySQL resmi image'inin (mysql:8.0) beklediği
#    environment variable isimleriyle birebir aynı - Deployment'ta
#    envFrom.secretRef ile doğrudan container'a enjekte edilir.
# -----------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: petclinic-mysql-secret
  namespace: ngn-springboot
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: root
  MYSQL_DATABASE: petclinic
  MYSQL_USER: petclinic
  MYSQL_PASSWORD: petclinic
