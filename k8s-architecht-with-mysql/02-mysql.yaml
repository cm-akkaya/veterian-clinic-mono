apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: petclinic-mysql-pvc
  namespace: ngn-springboot
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: petclinic-mysql
  namespace: ngn-springboot
  labels:
    app: petclinic-mysql
spec:
  replicas: 1
  strategy:
    type: Recreate   # RWO volume - ayni anda 2. pod baslamaya calisirsa "volume already attached" hatasi alinir
  selector:
    matchLabels:
      app: petclinic-mysql
  template:
    metadata:
      labels:
        app: petclinic-mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
              name: mysql
          envFrom:
            - secretRef:
                name: petclinic-mysql-secret
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h localhost -u$MYSQL_USER -p$MYSQL_PASSWORD"]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h localhost -u$MYSQL_USER -p$MYSQL_PASSWORD"]
            initialDelaySeconds: 40
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: petclinic-mysql-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: ngn-springboot
spec:
  selector:
    app: petclinic-mysql
  ports:
    - port: 3306
      targetPort: 3306
      name: mysql
  type: ClusterIP
