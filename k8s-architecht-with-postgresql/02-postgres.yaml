apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: petclinic-postgres-pvc
  namespace: ngn-springboot
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: petclinic-postgres
  namespace: ngn-springboot
  labels:
    app: petclinic-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate   # RWO volume - ayni anda 2. pod baslamaya calisirsa "volume already attached" hatasi alinir
  selector:
    matchLabels:
      app: petclinic-postgres
  template:
    metadata:
      labels:
        app: petclinic-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18.1
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - secretRef:
                name: petclinic-postgres-secret
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: petclinic-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ngn-springboot
spec:
  selector:
    app: petclinic-postgres
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  type: ClusterIP
